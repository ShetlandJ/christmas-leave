<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Christmas leave</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; color: #1f2933; background: #f7f7f5; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 16px; background: #fff; border-bottom: 1px solid #e0e0dc; position: sticky; top: 0; z-index: 3; }
    h1 { font-size: 17px; margin: 0; font-weight: 600; }
    .hint { font-size: 13px; color: #6b7280; }
    button { font: inherit; padding: 6px 12px; border: 1px solid #c9c9c4; border-radius: 6px; background: #fff; cursor: pointer; }
    button:active { background: #eee; }
    .wrap { overflow: auto; max-height: calc(100vh - 56px); }
    table { border-collapse: separate; border-spacing: 0; }
    th, td { border-right: 1px solid #e0e0dc; border-bottom: 1px solid #e0e0dc; text-align: center; white-space: nowrap; }
    thead th { position: sticky; background: #fff; z-index: 2; font-weight: 600; line-height: 1.2; }
    thead tr.months th { top: 0; height: 26px; font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: #6b7280; text-align: left; padding: 0 8px; }
    thead tr.days th { top: 26px; height: 46px; padding: 5px 6px; }
    thead tr.days .wd { display: block; font-size: 10px; font-weight: 500; letter-spacing: .04em; text-transform: uppercase; color: #6b7280; }
    thead tr.days .dn { display: block; font-size: 16px; font-weight: 600; }
    thead tr.days th.weekend .wd, thead tr.days th.weekend .dn { color: #9aa1ab; }
    thead tr.totals th, thead tr.totals td { position: sticky; top: 72px; height: auto; background: #fff; z-index: 2; font-size: 12px; font-weight: 600; padding: 4px 6px; color: #6b7280; border-bottom: 2px solid #c9c9c4; text-align: center; }
    thead tr.totals th { left: 0; z-index: 4; text-align: left; padding-left: 12px; font-weight: 500; }
    thead tr.totals td.hot { color: #b42318; }
    thead th.weekend, td.weekend { background: #efefeb; }
    th.ms, td.ms { border-left: 2px solid #c9c9c4; }
    tr.me th { background: #eef1f5; font-weight: 600; }
    tr.pinned td, tr.pinned th { border-bottom: 2px solid #c9c9c4; }
    tr.me td.cell { box-shadow: inset 0 0 0 1px #b4c0cc; }
    td.cell.ro { cursor: default; }
    td.cell.ro:hover { background: inherit; }
    td.cell.ro.weekend:hover { background: #efefeb; }
    tbody th { position: sticky; left: 0; background: #fff; z-index: 1; text-align: left; padding: 0 12px; font-weight: 500; min-width: 140px; }
    thead th:first-child { left: 0; z-index: 4; }
    td.cell { width: 56px; height: 44px; cursor: pointer; user-select: none; -webkit-tap-highlight-color: transparent; }
    td.cell:hover { background: #e7ebef; }
    td.cell.off { background: #3d4f61; color: #fff; font-weight: 600; }
    td.cell.off:hover { background: #32414f; }
    td.cell.pending::after { content: ''; position: absolute; right: 4px; top: 4px; width: 5px; height: 5px; border-radius: 50%; background: currentColor; opacity: .5; }
    td.cell { position: relative; }
    .empty { padding: 40px 16px; text-align: center; color: #6b7280; }
    .err { background: #fde8e8; color: #7a1c1c; padding: 8px 16px; font-size: 13px; }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>Christmas leave</h1>
      <div class="hint" id="hint">Loading…</div>
    </div>
    <button id="refresh">Refresh</button>
  </header>
  <div id="err" class="err" style="display:none"></div>
  <div class="wrap"><div id="grid" class="empty">Loading…</div></div>

  <script>
    var API = 'https://script.google.com/macros/s/AKfycbx4_-6gTRwgYTEq75aAcIQ__dKKYCRfmKKuW2aaPeqkwc2P8z706JujDSSe-0A_s-NMkw/exec';
    var TOKEN = location.hash.replace(/^#/, '');
    var grid = null;
    var inflight = 0;
    var MONTHS = { Jan: 'January', Feb: 'February', Mar: 'March', Apr: 'April', May: 'May', Jun: 'June', Jul: 'July', Aug: 'August', Sep: 'September', Oct: 'October', Nov: 'November', Dec: 'December' };

    function load() {
      fetch(API + '?json=1&token=' + encodeURIComponent(TOKEN) + '&_=' + Date.now())
        .then(function (r) { return r.json(); })
        .then(render)
        .catch(fail);
    }

    // text/plain avoids a CORS preflight, which Apps Script can't answer.
    function save(name, date, off) {
      return fetch(API, { method: 'POST', body: JSON.stringify({ token: TOKEN, date: date, off: off }), headers: { 'Content-Type': 'text/plain' } })
        .then(function (r) { return r.json(); })
        .then(function (res) { if (!res.ok) throw new Error(res.error || 'Save failed'); });
    }

    function fail(e) {
      var el = document.getElementById('err');
      el.textContent = 'Something went wrong: ' + (e && e.message ? e.message : e);
      el.style.display = 'block';
      setTimeout(function () { el.style.display = 'none'; }, 6000);
    }

    function paintCell(r, c, on) {
      var td = document.querySelector('td.cell[data-r="' + r + '"][data-c="' + c + '"]');
      if (!td) return;
      td.classList.toggle('off', on);
      td.textContent = on ? 'OFF' : '';
    }

    function paintTotals() {
      var tds = document.querySelectorAll('tr.totals td');
      grid.dates.forEach(function (_, c) {
        var t = grid.off.reduce(function (n, row) { return n + (row[c] ? 1 : 0); }, 0);
        if (tds[c]) { tds[c].textContent = t; tds[c].classList.toggle('hot', t >= Math.ceil(grid.names.length / 2)); }
      });
    }

    function render(data) {
      grid = data;
      document.getElementById('hint').textContent = data.me
        ? 'Hi ' + data.me.split(' ')[0] + '. Tap a box to mark yourself off, tap again to undo.'
        : 'View only. To mark your days, open the link you were sent.';
      var host = document.getElementById('grid');
      if (!data.names.length || !data.dates.length) {
        host.className = 'empty';
        host.textContent = 'Nothing here yet. Add names in column A and dates in row 1 of the sheet.';
        return;
      }
      host.className = '';
      var totals = data.dates.map(function (_, c) {
        return data.off.reduce(function (n, row) { return n + (row[c] ? 1 : 0); }, 0);
      });
      // Labels arrive as 'Mon 21 Dec'. Split them so the weekday sits over the day
      // number, and band the months across the top.
      var parts = data.dates.map(function (d) { return String(d.label).split(' '); });
      var ms = parts.map(function (p, i) { return i > 0 && p[2] !== parts[i - 1][2]; });
      var groups = [];
      parts.forEach(function (p) {
        var last = groups[groups.length - 1];
        if (last && last.m === p[2]) last.n++; else groups.push({ m: p[2], n: 1 });
      });
      var h = '<table><thead><tr class="months"><th></th>';
      groups.forEach(function (g, i) {
        h += '<th colspan="' + g.n + '"' + (i ? ' class="ms"' : '') + '>' + esc(MONTHS[g.m] || g.m) + '</th>';
      });
      h += '</tr><tr class="days"><th></th>';
      data.dates.forEach(function (d, c) {
        h += '<th class="' + (d.weekend ? 'weekend ' : '') + (ms[c] ? 'ms' : '') + '">'
          + '<span class="wd">' + esc(parts[c][0]) + '</span>'
          + '<span class="dn">' + esc(parts[c][1]) + '</span></th>';
      });
      h += '</tr><tr class="totals"><th>Off that day</th>';
      totals.forEach(function (t, c) {
        h += '<td class="' + (t >= Math.ceil(data.names.length / 2) ? 'hot ' : '') + (ms[c] ? 'ms' : '') + '">' + t + '</td>';
      });
      h += '</tr></thead><tbody>';
      // Your own row goes first; everyone else keeps the sheet's order. data-r
      // stays the index into data.off, so display order never touches the data.
      var order = data.names.map(function (_, i) { return i; });
      if (data.me) order.sort(function (a, b) {
        return (data.names[b] === data.me) - (data.names[a] === data.me);
      });
      order.forEach(function (r, pos) {
        var name = data.names[r];
        var mine = name === data.me;
        h += '<tr' + (mine ? ' class="me' + (pos === 0 ? ' pinned' : '') + '"' : '') + '><th>' + esc(name) + '</th>';
        data.dates.forEach(function (d, c) {
          var on = data.off[r][c];
          h += '<td class="cell' + (on ? ' off' : '') + (d.weekend ? ' weekend' : '') + (ms[c] ? ' ms' : '') + (mine ? '' : ' ro') + '" data-r="' + r + '" data-c="' + c + '">' + (on ? 'OFF' : '') + '</td>';
        });
        h += '</tr>';
      });
      h += '</tbody></table>';
      host.innerHTML = h;
    }

    function esc(s) {
      return String(s).replace(/[&<>"]/g, function (ch) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch];
      });
    }

    document.getElementById('grid').addEventListener('click', function (ev) {
      var td = ev.target.closest('td.cell');
      if (!td || !grid) return;
      var r = +td.dataset.r, c = +td.dataset.c;
      if (grid.names[r] !== grid.me) return;
      var on = !grid.off[r][c];
      grid.off[r][c] = on;
      paintCell(r, c, on);
      paintTotals();
      td.classList.add('pending');
      inflight++;
      save(grid.names[r], grid.dates[c].label, on)
        .then(function () {
          inflight--;
          td.classList.remove('pending');
        })
        .catch(function (e) {
          inflight--;
          td.classList.remove('pending');
          grid.off[r][c] = !on;
          paintCell(r, c, !on);
          paintTotals();
          fail(e);
        });
    });

    document.getElementById('refresh').addEventListener('click', load);
    setInterval(function () { if (!inflight) load(); }, 30000);
    load();
  </script>
</body>
</html>
